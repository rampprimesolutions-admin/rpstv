<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transmisión HLS en Vivo - 85° Aniversario</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    .gold-gradient {
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #d4af37, #f3e5ab, #aa771c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- ENCABEZADO -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full gold-gradient p-0.5 flex items-center justify-center shadow-lg shadow-amber-500/10">
          <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center font-bold text-amber-400 text-lg">85</div>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight gold-text">Gran Gala del 85° Aniversario</h1>
          <p class="text-xs text-slate-400">Transmisión HLS Multi-Sucursal en Directo</p>
        </div>
      </div>
      <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/30 px-3 py-1.5 rounded-full text-red-400 text-xs font-semibold animate-pulse">
        <span class="w-2 h-2 rounded-full bg-red-500"></span> EN VIVO HLS
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- REPRODUCTOR DE VIDEO -->
    <section class="lg:col-span-2 space-y-4">
      <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center">
        <!-- UN SOLO REPRODUCTOR CON CONTROLES NATIVOS -->
        <video id="hlsPlayer" controls autoplay muted playsinline class="w-full h-full object-contain">
          Tu navegador no soporta la reproducción de video HTML5.
        </video>
      </div>
      
      <!-- DETALLE DE LA SEÑAL ACTIVA -->
      <div class="bg-slate-900/30 border border-slate-800/50 rounded-xl p-4 flex items-center justify-between">
        <div>
          <span id="activeBadge" class="text-xs font-semibold uppercase tracking-wider text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-md">
            Sede Central
          </span>
          <h2 id="activeTitle" class="text-lg font-bold mt-2">Auditorio Principal</h2>
        </div>
        <div class="flex items-center gap-2 text-slate-400 text-sm">
          <i data-lucide="radio" class="w-4 h-4 text-emerald-400 animate-pulse"></i>
          <span class="text-xs text-slate-300">Señal HLS / TS Directa</span>
        </div>
      </div>
    </section>

    <!-- LISTA DE SUCURSALES -->
    <aside class="space-y-4">
      <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
        <i data-lucide="signal" class="w-4 h-4 text-amber-400"></i> Seleccionar Streaming
      </h3>

      <div class="space-y-3" id="streamList">
        <!-- Renderizado dinámico -->
      </div>
    </aside>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Institución Educativa — 85 Años Educando con Excelencia</p>
  </footer>

  <!-- JAVASCRIPT LIGERO Y ESTABLE -->
  <script>
    // --- CONFIGURACIÓN DE STREAMS (Cambia aquí las URLs por las tuyas reales) ---
    const streams = [
      { id: 1, name: "Sede Central", location: "Auditorio Principal", hlsUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", active: false },
      { id: 2, name: "Sucursal Norte", location: "Patio de Honor", hlsUrl: "https://playertest.longtailvideo.com/adaptive/oceans/oceans.m3u8", active: false },
      { id: 3, name: "Sucursal Sur", location: "Coliseo Deportivo", hlsUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", active: false },
      { id: 4, name: "Sucursal Este", location: "Sala de Protocolo", hlsUrl: "https://playertest.longtailvideo.com/adaptive/oceans/oceans.m3u8", active: false },
      { id: 5, name: "Sucursal Oeste", location: "Campo Abierto", hlsUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", active: false },
	  { id: 6, name: "Sucursal Test (Móvil)", location: "Prueba HLS en Vivo", hlsUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", active: true }
    ];

    let hlsInstance = null;
    const videoElement = document.getElementById('hlsPlayer');

    // --- MOTOR HLS (Robusto y sin errores) ---
    function loadHlsStream(url) {
      if (Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoElement);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
          videoElement.play().catch(e => console.log("Autoplay bloqueado:", e));
        });
      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        // Soporte nativo en Safari
        videoElement.src = url;
        videoElement.addEventListener('loadedmetadata', function() { videoElement.play(); });
      } else {
        alert("Tu navegador no soporta transmisiones HLS.");
      }
    }

    // --- LISTADO DE SUCURSALES ---
    function renderStreams() {
      const container = document.getElementById('streamList');
      container.innerHTML = '';
      streams.forEach(stream => {
        const card = document.createElement('button');
        card.className = `w-full text-left p-3.5 rounded-xl border transition-all duration-200 flex items-center justify-between ${
          stream.active ? 'bg-amber-500/10 border-amber-500/50 shadow-lg shadow-amber-500/5' : 'bg-slate-900/40 border-slate-800 hover:border-slate-700 hover:bg-slate-900'
        }`;
        card.onclick = () => selectStream(stream.id);
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg ${stream.active ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'} flex items-center justify-center font-bold">${stream.id}</div>
            <div>
              <div class="font-semibold text-sm ${stream.active ? 'text-amber-400' : 'text-slate-200'}">${stream.name}</div>
              <div class="text-xs text-slate-400">${stream.location}</div>
            </div>
          </div>
          ${stream.active ? '<span class="flex h-2.5 w-2.5 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span></span>' : '<i data-lucide="play" class="w-4 h-4 text-slate-500"></i>'}
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    // --- CAMBIAR DE STREAM ---
    function selectStream(id) {
      streams.forEach(s => s.active = (s.id === id));
      const selected = streams.find(s => s.id === id);
      document.getElementById('activeBadge').textContent = selected.name;
      document.getElementById('activeTitle').textContent = `${selected.location}`;
      
      loadHlsStream(selected.hlsUrl);
      renderStreams();
    }

    // --- INICIALIZACIÓN ---
    document.addEventListener('DOMContentLoaded', () => {
      renderStreams();
      const initialStream = streams.find(s => s.active);
      loadHlsStream(initialStream.hlsUrl);
    });
  </script>
</body>
</html>
