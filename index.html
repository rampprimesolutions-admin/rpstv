<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPSTV - Streaming VIP v2.3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- ENCABEZADO -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-500 p-0.5 flex items-center justify-center shadow-lg">
          <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center font-bold text-amber-400">📺</div>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-amber-400">RPSTV - Streaming VIP v2.3</h1>
          <p class="text-xs text-slate-400">Monitoreo QoS, Telemetria & Auto-Scheduler</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="scheduleBtn" onclick="openScheduleModal()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 text-xs transition">
          <i data-lucide="clock" class="w-4 h-4 text-amber-400"></i>
          <span>Programar Canal</span>
        </button>

        <button id="castBtn" onclick="castToTV()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 text-xs transition">
          <i data-lucide="cast" class="w-4 h-4 text-amber-400"></i>
          <span>Enviar a TV</span>
        </button>

        <button id="toggleFavFilterBtn" onclick="toggleFavoriteFilter()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 text-xs transition">
          <i data-lucide="star" class="w-4 h-4 text-amber-400"></i>
          <span id="favFilterText">Ver Favoritos</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
    
	<!-- SECCIÓN DEL REPRODUCTOR CON CONTENEDOR FULLSCREEN -->
	<section class="lg:col-span-2">
	  <div class="sticky top-20 space-y-4">
		
		<!-- CONTENEDOR DEL REPRODUCTOR -->
		<div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center">
		  
		  <!-- Reloj Digital (Superior Izquierda) -->
		  <div id="digitalClockBadge" class="absolute top-3 left-3 z-20 bg-slate-950/80 backdrop-blur-md border border-slate-800 px-3 py-1.5 rounded-xl text-amber-400 font-mono text-xs tracking-wider shadow-xl flex items-center gap-2 pointer-events-none transition-opacity duration-300">
			<i data-lucide="clock" class="w-3.5 h-3.5 text-amber-400"></i>
			<span id="digitalClock">00:00:00</span>
		  </div>

		  <!-- Banner de Notificación del Programador -->
		  <div id="schedulerNotice" class="hidden absolute top-3 right-3 z-20 bg-amber-500 text-slate-950 px-3 py-1 rounded-lg text-xs font-bold shadow-lg items-center gap-1.5 animate-pulse">
			<i data-lucide="calendar-check" class="w-3.5 h-3.5"></i>
			<span id="schedulerNoticeText">Cambio programado activo</span>
		  </div>

		  <video id="hlsPlayer" controls autoplay muted playsinline class="w-full h-full object-contain"></video>
		</div>
		
		<!-- CONTROLES INFERIORES -->
		<div class="grid grid-cols-4 gap-2">
		  <button onclick="changeChannelRelative(-1)" class="flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-semibold text-slate-300 transition">
			<i data-lucide="chevron-left" class="w-4 h-4"></i> Canal Ant.
		  </button>
		  <button id="preChannelBtn" onclick="goToPreviousChannel()" disabled class="flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-semibold text-amber-400 disabled:opacity-40 disabled:cursor-not-allowed transition">
			<i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Pre-Channel
		  </button>
		  <button onclick="changeChannelRelative(1)" class="flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-semibold text-slate-300 transition">
			Sig. Canal <i data-lucide="chevron-right" class="w-4 h-4"></i>
		  </button>
		  <button onclick="toggleClockVisibility()" class="flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-semibold text-slate-300 transition" title="Mostrar/Ocultar Reloj (Tecla R)">
			<i data-lucide="clock" class="w-4 h-4 text-amber-400"></i> Reloj [R]
		  </button>
		</div>

		<!-- TARJETA DE CANAL ACTIVO -->
		<div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
		  <div class="flex items-center gap-3">
			<img id="activeLogo" src="" class="w-12 h-12 object-contain rounded-md bg-slate-800/50 p-1 hidden" alt="Logo" />
			<div>
			  <span id="activeCategory" class="text-xl font-extrabold text-amber-400 block tracking-wide uppercase">CARGANDO...</span>
			  <h2 id="activeTitle" class="text-xs font-semibold text-slate-300 tracking-wider mt-0.5">Seleccione un canal</h2>
			</div>
		  </div>
		  
		  <button id="activeFavBtn" onclick="toggleFavorite(currentStream?.id)" class="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-amber-400 transition">
			<i data-lucide="star" class="w-5 h-5"></i>
		  </button>
		</div>

	  </div>
	</section>

    <!-- PANEL LATERAL CON BUSCADOR Y LISTA -->
    <aside class="space-y-4">
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="signal" class="w-4 h-4 text-amber-400"></i> <span id="listTitle">Lista de Canales</span>
          </h3>
          <span id="channelCount" class="text-xs font-semibold text-amber-400/90 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">0 canales</span>
        </div>

        <!-- BUSCADOR DE CANALES EN TIEMPO REAL -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Buscar canal por nombre..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-8 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 transition" />
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <div class="space-y-2.5 max-h-[calc(100vh-16rem)] overflow-y-auto pr-1" id="streamList"></div>
    </aside>

  </main>

  <!-- MODAL DE PROGRAMACION DE CANALES -->
  <div id="scheduleModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4"></i> Programar Auto-Switch
        </h3>
        <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Seleccionar Canal:</label>
          <select id="scheduleChannelSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500"></select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Hora de Ejecucion (Hoy):</label>
          <input type="time" id="scheduleTimeInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500" />
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeScheduleModal()" class="px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-slate-400 hover:bg-slate-800">Cancelar</button>
        <button onclick="setChannelSchedule()" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold">Guardar Programacion</button>
      </div>
    </div>
  </div>

  <script>
    const REPORT_WEBHOOK_URL = "https://discordapp.com/api/webhooks/1545153044843462766/Ksj7pXq78kwQNrQTUEPzVRRfiq0PymD2VoZZPixFYTqXPTFmbbTmt7BqIafa93oTWG33";

    let streams = [];
    let hlsInstance = null;
    let currentStream = null;
    let previousStreamId = null;
    let showingOnlyFavorites = false;
    let searchQuery = "";
    let bufferCheckTimer = null;
    let scheduledTimer = null;
    let reportedChannels = new Set();

    let favorites = JSON.parse(localStorage.getItem('rpstv_favorites')) || [];
    const videoElement = document.getElementById('hlsPlayer');

    // RELOJ EN TIEMPO REAL
    function updateClock() {
      const now = new Date();
      document.getElementById('digitalClock').textContent = now.toLocaleTimeString('es-ES', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getDeviceDetails() {
      const ua = navigator.userAgent;
      if (/Android/i.test(ua)) {
        return (/wv|Version\/[\d\.]+/i.test(ua)) ? "App Android (Kodular APK)" : "Movil Android (Navegador)";
      }
      if (/iPhone|iPad|iPod/i.test(ua)) return "Dispositivo iOS (iPhone/iPad)";
      if (/Windows/i.test(ua)) return "PC / Laptop (Windows)";
      if (/Macintosh|Mac OS X/i.test(ua)) return "Laptop / Mac (macOS)";
      return "Navegador Web Generico";
    }

    function sendStreamAlert(channelName, errorType, details) {
      if (!REPORT_WEBHOOK_URL || REPORT_WEBHOOK_URL.includes("TU_WEBHOOK_AQUI")) {
        console.warn("[Telemetria] URL de Webhook no configurada.");
        return;
      }

      const reportKey = `${channelName}_${errorType}`;
      if (reportedChannels.has(reportKey)) return;
      reportedChannels.add(reportKey);

      const payload = {
        content: "🚨 **ALERTA DE SEÑAL CAÍDA - RPSTV**",
        embeds: [{
          title: `Canal: ${channelName}`,
          color: 15158332,
          fields: [
            { name: "Tipo de Error", value: errorType, inline: true },
            { name: "Origen / Dispositivo", value: getDeviceDetails(), inline: true },
            { name: "Detalles Tecnicos", value: details || "Sin detalles adicionales" }
          ],
          timestamp: new Date().toISOString()
        }]
      };

      fetch(REPORT_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(res => {
        if (res.ok) console.log("[Telemetria] Alerta enviada con exito a Discord.");
      })
      .catch(err => console.error("[Telemetria] Error de red al enviar a Discord:", err));
    }

    async function fetchStreams() {
      const gistRawUrl = 'https://gist.githubusercontent.com/rampprimesolutions-admin/7c2e780742d4285ce388cd18ceacb227/raw/channels.json?v=' + new Date().getTime();
      
      try {
        let response = await fetch(gistRawUrl, { cache: 'no-store' });
        const data = await response.json();
        streams = Array.isArray(data) ? data : (data.channels || []);
      } catch (error) {
        console.error("Error cargando Gist", error);
      }

      renderStreams();
      if (streams.length > 0) selectStream(streams[0].id, false);
      populateScheduleSelect();
    }

    function loadHlsStream(url) {
      if (bufferCheckTimer) clearTimeout(bufferCheckTimer);

      if (!url || url.trim() === "" || !url.startsWith("http")) {
        sendStreamAlert(currentStream ? currentStream.location : "Desconocido", "Enlace Inexistente / URL Vacia", "El canal no posee una URL de streaming configurada.");
        if (hlsInstance) hlsInstance.destroy();
        videoElement.src = "";
        return;
      }

      // Deteccion preventiva de Mixed Content
      if (window.location.protocol === 'https:' && url.startsWith('http:')) {
        console.warn("[QoS] Intento de carga HTTP en entorno HTTPS.");
      }

      if (Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoElement);

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            const channelInfo = currentStream ? currentStream.location : "Desconocido";
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              sendStreamAlert(channelInfo, "Señal Caida (Error de Red / 404 / Offline)", `Detalle: ${data.details}`);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              sendStreamAlert(channelInfo, "Fallo de Decodificacion Media", `Detalle: ${data.details}`);
              hlsInstance.recoverMediaError();
            }
          }
        });

      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        videoElement.src = url;
      }
    }

    // TIMEOUT DE BUFFER AJUSTADO A 20 SEGUNDOS (MENOS FALSOS POSITIVOS)
    videoElement.addEventListener('waiting', () => {
      if (bufferCheckTimer) clearTimeout(bufferCheckTimer);
      bufferCheckTimer = setTimeout(() => {
        if (!videoElement.paused && currentStream && videoElement.readyState < 3) {
          sendStreamAlert(currentStream.location, "Congelamiento de Stream (Buffer Timeout 20s)", "El video supero los 20 segundos de espera sin buffer.");
        }
      }, 20000);
    });

    videoElement.addEventListener('playing', () => {
      if (bufferCheckTimer) clearTimeout(bufferCheckTimer);
    });

    function selectStream(id, recordHistory = true) {
      if (currentStream && currentStream.id !== id && recordHistory) {
        previousStreamId = currentStream.id;
        document.getElementById('preChannelBtn').disabled = false;
      }

      streams.forEach(s => s.active = (s.id === id));
      currentStream = streams.find(s => s.id === id);
      
      document.getElementById('activeCategory').textContent = currentStream.location || '';
      document.getElementById('activeTitle').textContent = currentStream.name || '';

      const activeLogo = document.getElementById('activeLogo');
      if (currentStream.logoUrl) {
        activeLogo.src = currentStream.logoUrl;
        activeLogo.classList.remove('hidden');
      } else {
        activeLogo.classList.add('hidden');
      }

      updateActiveFavButton();
      loadHlsStream(currentStream.hlsUrl);
      renderStreams();
    }

    // RENDERIZADO CON BUSCADOR Y CONTADOR DINAMICO
    function renderStreams() {
      const container = document.getElementById('streamList');
      container.innerHTML = '';

      let filtered = showingOnlyFavorites ? streams.filter(s => favorites.includes(s.id)) : streams;

      if (searchQuery.trim() !== "") {
        const query = searchQuery.toLowerCase();
        filtered = filtered.filter(s => 
          (s.location && s.location.toLowerCase().includes(query)) ||
          (s.name && s.name.toLowerCase().includes(query))
        );
      }

      // Actualizacion del contador inteligente
      const countLabel = showingOnlyFavorites ? `${filtered.length} favoritos` : `${filtered.length} canales`;
      document.getElementById('channelCount').textContent = countLabel;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">No se encontraron canales.</div>`;
        return;
      }

      filtered.forEach(stream => {
        const isFav = favorites.includes(stream.id);
        const card = document.createElement('div');
        
        card.className = `w-full p-3 rounded-xl border transition-all duration-200 flex items-center justify-between gap-2 ${
          stream.active ? 'bg-amber-500/10 border-amber-500/50 shadow-md' : 'bg-slate-900/40 border-slate-800 hover:bg-slate-900'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3 cursor-pointer flex-1 min-w-0" onclick="selectStream(${stream.id})">
            <div class="w-11 h-11 rounded-lg bg-slate-800 flex items-center justify-center overflow-hidden border border-slate-700 flex-shrink-0">
              ${stream.logoUrl 
                ? `<img src="${stream.logoUrl}" class="w-full h-full object-contain p-1" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=TV';"/>`
                : `<span class="font-bold text-slate-400 text-xs">${stream.id}</span>`
              }
            </div>
            <div class="truncate">
              <div class="font-bold text-base truncate ${stream.active ? 'text-amber-400' : 'text-slate-100'}">${stream.location}</div>
              <div class="text-xs text-slate-400 truncate">${stream.name}</div>
            </div>
          </div>
          
          <button onclick="toggleFavorite(${stream.id}); event.stopPropagation();" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-500 transition">
            <i data-lucide="star" class="w-4 h-4 ${isFav ? 'fill-amber-400 text-amber-400' : ''}"></i>
          </button>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // FUNCIONES DEL BUSCADOR
    function handleSearch() {
      const input = document.getElementById('searchInput');
      searchQuery = input.value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', searchQuery === "");
      renderStreams();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = "";
      searchQuery = "";
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderStreams();
    }

    // PROGRAMADOR DE CANALES (AUTO-SWITCH)
    function openScheduleModal() {
      document.getElementById('scheduleModal').classList.remove('hidden');
    }

    function closeScheduleModal() {
      document.getElementById('scheduleModal').classList.add('hidden');
    }

    function populateScheduleSelect() {
      const select = document.getElementById('scheduleChannelSelect');
      select.innerHTML = '';
      streams.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.location} - ${s.name}`;
        select.appendChild(opt);
      });
    }

    function setChannelSchedule() {
      const channelId = parseInt(document.getElementById('scheduleChannelSelect').value);
      const timeValue = document.getElementById('scheduleTimeInput').value;

      if (!timeValue) {
        alert("Por favor selecciona una hora valida.");
        return;
      }

      const [hours, minutes] = timeValue.split(':').map(Number);
      const now = new Date();
      const targetTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);

      if (targetTime <= now) {
        alert("La hora seleccionada ya transcurrio hoy. Elige una hora futura.");
        return;
      }

      const msToWait = targetTime - now;

      if (scheduledTimer) clearTimeout(scheduledTimer);

      scheduledTimer = setTimeout(() => {
        selectStream(channelId);
        showScheduleNotice(`Auto-Switch ejecutado`);
        setTimeout(hideScheduleNotice, 8000);
      }, msToWait);

      const targetStream = streams.find(s => s.id === channelId);
      showScheduleNotice(`Programado: ${targetStream ? targetStream.location : 'Canal'} a las ${timeValue}`);
      closeScheduleModal();
    }

    function showScheduleNotice(text) {
      const notice = document.getElementById('schedulerNotice');
      document.getElementById('schedulerNoticeText').textContent = text;
      notice.classList.remove('hidden');
      notice.classList.add('flex');
    }

    function hideScheduleNotice() {
      const notice = document.getElementById('schedulerNotice');
      notice.classList.add('hidden');
      notice.classList.remove('flex');
    }

    function castToTV() {
      if (videoElement.remote && videoElement.remote.state !== 'disconnected') {
        videoElement.remote.prompt();
      } else if (videoElement.webkitShowPlaybackTargetPicker) {
        videoElement.webkitShowPlaybackTargetPicker();
      } else {
        alert("Transmisión a Smart TV: Selecciona la opción 'Enviar/Cast' desde el menú de opciones de tu navegador Chrome.");
      }
    }

    function changeChannelRelative(offset) {
      const list = showingOnlyFavorites ? streams.filter(s => favorites.includes(s.id)) : streams;
      if (list.length === 0) return;
      const currentIndex = list.findIndex(s => s.id === currentStream.id);
      let newIndex = (currentIndex + offset + list.length) % list.length;
      selectStream(list[newIndex].id);
    }

    function goToPreviousChannel() {
      if (previousStreamId) selectStream(previousStreamId);
    }

    function toggleFavorite(id) {
      if (!id) return;
      favorites = favorites.includes(id) ? favorites.filter(favId => favId !== id) : [...favorites, id];
      localStorage.setItem('rpstv_favorites', JSON.stringify(favorites));
      updateActiveFavButton();
      renderStreams();
    }

    function updateActiveFavButton() {
      const btn = document.getElementById('activeFavBtn');
      if (!currentStream) return;
      const isFav = favorites.includes(currentStream.id);
      btn.innerHTML = `<i data-lucide="star" class="w-5 h-5 ${isFav ? 'fill-amber-400 text-amber-400' : ''}"></i>`;
      lucide.createIcons();
    }

    function toggleFavoriteFilter() {
      showingOnlyFavorites = !showingOnlyFavorites;
      document.getElementById('favFilterText').textContent = showingOnlyFavorites ? 'Ver Todos' : 'Ver Favoritos';
      document.getElementById('listTitle').textContent = showingOnlyFavorites ? 'Canales Favoritos' : 'Lista de Canales';
      renderStreams();
    }
	
	// CONTROL DE VISIBILIDAD DEL RELOJ (TECLA R Y BOTÓN)
	function toggleClockVisibility() {
	  const clockBadge = document.getElementById('digitalClockBadge');
	  clockBadge.classList.toggle('hidden');
	}

	// CAPTURA DE TECLADO MEJORADA (TECLA R)
	document.addEventListener('keydown', (e) => {
	  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
	  if (['ArrowUp', 'w', 'W'].includes(e.key)) changeChannelRelative(-1);
	  if (['ArrowDown', 's', 'S'].includes(e.key)) changeChannelRelative(1);
	  if (['p', 'P', 'Backspace'].includes(e.key)) goToPreviousChannel();
	  if (['r', 'R'].includes(e.key)) toggleClockVisibility(); // Toggle del Reloj
	});

    document.addEventListener('DOMContentLoaded', fetchStreams);
  </script>
</body>
</html>
