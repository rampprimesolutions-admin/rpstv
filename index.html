<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPSTV Streaming VIP v2.3.4</title>

  <!-- PERMITIR PETICIONES MIXTAS Y RECURSOS NO SEGUROS -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap: content: blob:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'; media-src * blob: data: http: https:;">
  <meta name="referrer" content="no-referrer">
  
  <style>
    /* Quita bordes redondeados al estar en Pantalla Completa */
    #playerContainer:fullscreen,
    #playerContainer:-webkit-full-screen {
  	  border-radius: 0 !important;
	  border: none !important;
    }
  </style>

  <!-- CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- ENCABEZADO -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-500 p-0.5 flex items-center justify-center shadow-lg">
          <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center font-bold text-amber-400">📡</div>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-amber-400">RPSTV Streaming v2.3.4</h1>
          <p class="text-xs text-slate-400">Experiencia VIP en Streaming y TV en VIVO</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="scheduleBtn" onclick="openScheduleModal()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 text-xs transition">
          <i data-lucide="clock" class="w-4 h-4 text-amber-400"></i>
          <span>Programar Canal</span>
        </button>

        <button id="castBtn" onclick="castToTV()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 text-xs transition">
          <i data-lucide="cast" class="w-4 h-4 text-amber-400"></i>
          <span>Enviar a TV</span>
        </button>

        <button id="toggleFavFilterBtn" onclick="toggleFavoriteFilter()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 text-xs transition">
          <i data-lucide="star" class="w-4 h-4 text-amber-400"></i>
          <span id="favFilterText">Ver Favoritos</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
    
	<!-- SECCIÓN DEL REPRODUCTOR CON CONTENEDOR FULLSCREEN -->
	<section class="lg:col-span-2">
	  <div class="sticky top-20 space-y-4">
		
		<!-- CONTENEDOR PRINCIPAL -->
		<div id="playerContainer" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center touch-none">
		  
		  <!-- Reloj Digital (Superior Izquierda) -->
		  <div id="digitalClockBadge" class="absolute top-3 left-3 z-30 bg-slate-950/80 backdrop-blur-md border border-slate-800 px-3 py-1.5 rounded-xl text-amber-400 font-mono text-xs tracking-wider shadow-xl flex items-center gap-2 pointer-events-none transition-opacity duration-300">
			<i data-lucide="clock" class="w-3.5 h-3.5 text-amber-400"></i>
			<span id="digitalClock">00:00:00</span>
		  </div>

		  <!-- OSD / Feedback Visual de Gestos Táctiles -->
		  <div id="gestureOsd" class="hidden absolute z-40 bg-slate-950/85 text-amber-400 px-4 py-2 rounded-2xl font-bold text-sm tracking-wide shadow-2xl backdrop-blur border border-amber-500/30 flex items-center gap-2 pointer-events-none transition-all duration-200">
			<i id="gestureOsdIcon" data-lucide="volume-2" class="w-5 h-5"></i>
			<span id="gestureOsdText">--</span>
		  </div>

		  <!-- Banner de Notificación del Programador -->
		  <div id="schedulerNotice" class="hidden absolute top-3 right-3 z-30 bg-amber-500 text-slate-950 px-3 py-1 rounded-lg text-xs font-bold shadow-lg items-center gap-1.5 animate-pulse">
			<i data-lucide="calendar-check" class="w-3.5 h-3.5"></i>
			<span id="schedulerNoticeText">Cambio programado activo</span>
		  </div>

		  <video id="hlsPlayer" controls autoplay muted playsinline class="w-full h-full object-contain pointer-events-auto"></video>
		</div>
		
		<!-- CONTROLES INFERIORES -->
		<div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
		  <button onclick="changeChannelRelative(-1)" class="flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-semibold text-slate-300 transition">
			<i data-lucide="chevron-left" class="w-4 h-4"></i> Canal Ant.
		  </button>
		  <button id="preChannelBtn" onclick="goToPreviousChannel()" disabled class="flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-semibold text-amber-400 disabled:opacity-40 disabled:cursor-not-allowed transition">
			<i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Pre-Canal
		  </button>
		  <button onclick="changeChannelRelative(1)" class="flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-semibold text-slate-300 transition">
			Sig. Canal <i data-lucide="chevron-right" class="w-4 h-4"></i>
		  </button>
		  <button onclick="toggleClockVisibility()" class="flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-semibold text-slate-300 transition" title="Mostrar/Ocultar Reloj">
			<i data-lucide="clock" class="w-4 h-4 text-amber-400"></i> Reloj
		  </button>
		</div>

		<!-- SELECTOR DINÁMICO DE PISTAS DE AUDIO -->
		<div id="audioTrackContainer" class="hidden flex items-center justify-between bg-slate-900/90 border border-amber-500/30 px-3 py-2 rounded-xl">
		  <div class="flex items-center gap-2">
			<i data-lucide="volume-2" class="w-4 h-4 text-amber-400 animate-pulse"></i>
			<span class="text-xs font-bold text-amber-400">Audio Múltiple:</span>
		  </div>
		  <select id="audioTrackSelect" onchange="changeAudioTrack(this.value)" class="bg-slate-950 border border-slate-800 text-xs font-semibold text-slate-200 rounded-lg px-2 py-1 focus:outline-none focus:border-amber-400">
		  </select>
		</div>
		
		<!-- SELECTOR DINÁMICO DE SUBTÍTULOS -->
		<div id="subtitleTrackContainer" class="hidden flex items-center justify-between bg-slate-900/90 border border-amber-500/30 px-3 py-2 rounded-xl mt-2">
		  <div class="flex items-center gap-2">
			<i data-lucide="captions" class="w-4 h-4 text-amber-400"></i>
			<span class="text-xs font-bold text-amber-400">Subtítulos (CC):</span>
		  </div>
		  <select id="subtitleTrackSelect" onchange="changeSubtitleTrack(this.value)" class="bg-slate-950 border border-slate-800 text-xs font-semibold text-slate-200 rounded-lg px-2 py-1 focus:outline-none focus:border-amber-400">
		  </select>
		</div>

		<!-- TARJETA DE CANAL ACTIVO -->
		<div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
		  <div class="flex items-center gap-3">
			<img id="activeLogo" src="" class="w-12 h-12 object-contain rounded-md bg-slate-800/50 p-1 hidden" alt="Logo" />
			<div>
			  <span id="activeCategory" class="text-xl font-extrabold text-amber-400 block tracking-wide uppercase">CARGANDO...</span>
			  <h2 id="activeTitle" class="text-xs font-semibold text-slate-300 tracking-wider mt-0.5">Seleccione un canal</h2>
			</div>
		  </div>
		  
		  <button id="activeFavBtn" onclick="toggleFavorite(currentStream?.id)" class="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-amber-400 transition">
			<i data-lucide="star" class="w-5 h-5"></i>
		  </button>
		</div>

	  </div>
	</section>
	
    <!-- PANEL LATERAL CON BUSCADOR Y LISTA -->
    <aside class="space-y-4">
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="signal" class="w-4 h-4 text-amber-400"></i> <span id="listTitle">Lista de Canales</span>
          </h3>
          <span id="channelCount" class="text-xs font-semibold text-amber-400/90 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">0 canales</span>
        </div>

        <!-- BUSCADOR EN TIEMPO REAL -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Buscar canal por nombre..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-8 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 transition" />
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
		
		<!-- FILTRO POR PAÍS -->
		<div class="mb-3">
		  <select id="countryFilter" onchange="filterStreams()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-semibold text-slate-300 focus:outline-none focus:border-amber-400">
			<option value="ALL">🌎 Todos los Países (A-Z)</option>
		  </select>
		</div>
      </div>

      <div class="space-y-2.5 max-h-[calc(100vh-16rem)] overflow-y-auto pr-1" id="streamList"></div>
    </aside>

  </main>

  <!-- MODAL DE PROGRAMACION DE CANALES -->
  <div id="scheduleModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4"></i> Programar Auto-Switch
        </h3>
        <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">SELECCIONAR CANAL</label>
          <select id="scheduleChannelSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500"></select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">HORA DE EJECUCIÓN (HOY)</label>
          <input type="time" id="scheduleTimeInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500" />
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeScheduleModal()" class="px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-slate-400 hover:bg-slate-800">Cancelar</button>
        <button onclick="setChannelSchedule()" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold">Guardar Programación</button>
      </div>
    </div>
  </div>

  <script>
    const REPORT_WEBHOOK_URL = "https://discordapp.com/api/webhooks/1545153044843462766/Ksj7pXq78kwQNrQTUEPzVRRfiq0PymD2VoZZPixFYTqXPTFmbbTmt7BqIafa93oTWG33";

    let streams = [];
    let allStreams = [];
    let hlsInstance = null;
    let currentStream = null;
    let previousStreamId = null;
    let showingOnlyFavorites = false;
    let searchQuery = "";
    let bufferCheckTimer = null;
    let scheduledTimer = null;
    let reportedChannels = new Set();

    let favorites = JSON.parse(localStorage.getItem('rpstv_favorites')) || [];
    const videoElement = document.getElementById('hlsPlayer');
    const FALLBACK_VIDEO_URL = "https://cdn.jsdelivr.net/gh/rampprimesolutions-admin/rpstv@main/estatica.mp4";

    // RELOJ EN TIEMPO REAL
    function updateClock() {
      const now = new Date();
      document.getElementById('digitalClock').textContent = now.toLocaleTimeString('es-ES', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getDeviceDetails() {
      const ua = navigator.userAgent;
      if (/Android/i.test(ua)) {
        return (/wv|Version\/[\d\.]+/i.test(ua)) ? "App Android (APK)" : "Móvil Android (Navegador)";
      }
      if (/iPhone|iPad|iPod/i.test(ua)) return "Dispositivo iOS (iPhone/iPad)";
      if (/Windows/i.test(ua)) return "PC/Laptop (Windows)";
      if (/Macintosh|Mac OS X/i.test(ua)) return "Laptop/MAC (macOS)";
      return "Navegador Web Genérico";
    }

    function sendStreamAlert(channelName, errorType, details) {
      if (!REPORT_WEBHOOK_URL || REPORT_WEBHOOK_URL.includes("TU_WEBHOOK_AQUI")) return;

      const reportKey = `${channelName}_${errorType}`;
      if (reportedChannels.has(reportKey)) return;
      reportedChannels.add(reportKey);

      const payload = {
        content: "🚨 **ALERTA DE SEÑAL CAÍDA (RPSTV)**",
        embeds: [{
          title: `**CANAL:** ${channelName}`,
          color: 15158332,
          fields: [
            { name: "**TIPO DE ERROR**", value: errorType, inline: true },
            { name: "**ORIGEN/DISPOSITIVO**", value: getDeviceDetails(), inline: true },
            { name: "**DETALLE TÉCNICO**", value: details || "Sin detalle adicional" }
          ],
          timestamp: new Date().toISOString()
        }]
      };

      fetch(REPORT_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => console.error("[Telemetría] Error de red:", err));
    }
    
	// CARGA DE CANALES
	async function fetchStreams() {
	  const gistRawUrl = 'https://gist.githubusercontent.com/rampprimesolutions-admin/7c2e780742d4285ce388cd18ceacb227/raw/channels.json?v=' + new Date().getTime();
	  
	  try {
		let response = await fetch(gistRawUrl, { cache: 'no-store' });
		const data = await response.json();
		let rawStreams = Array.isArray(data) ? data : (data.channels || []);
		
		allStreams = rawStreams.sort((a, b) => {
		  const nameA = (a.location || '').toLowerCase();
		  const nameB = (b.location || '').toLowerCase();
		  return nameA.localeCompare(nameB, 'es', { sensitivity: 'base' });
		});

		populateCountryFilter(allStreams);
		
		const savedCountry = localStorage.getItem('rpstv_last_country');
		const countrySelect = document.getElementById('countryFilter');
		if (savedCountry && countrySelect) {
		  countrySelect.value = savedCountry;
		}
		
		filterStreams();

		const savedChannelId = localStorage.getItem('rpstv_last_channel');
		const targetChannel = streams.find(s => s.id == savedChannelId) || allStreams.find(s => s.id == savedChannelId);

		if (targetChannel) {
		  selectStream(targetChannel.id, false);
		} else if (streams.length > 0) {
		  selectStream(streams[0].id, false);
		} else if (allStreams.length > 0) {
		  selectStream(allStreams[0].id, false);
		}

	  } catch (error) {
		console.error("Error cargando Gist", error);
	  }

	  populateScheduleSelect();
	}
	
	let connectionWatchdog = null;
	
	function loadHlsStream(url) {
	  if (bufferCheckTimer) clearTimeout(bufferCheckTimer);
	  if (connectionWatchdog) clearTimeout(connectionWatchdog);

	  if (!url || url.trim() === "" || !url.startsWith("http")) {
		handleStreamError(hlsInstance);
		return;
	  }

	  connectionWatchdog = setTimeout(() => {
		if (videoElement.currentTime === 0 || videoElement.readyState < 2) {
		  handleStreamError(hlsInstance);
		}
	  }, 12000);

	  if (Hls.isSupported()) {
		if (hlsInstance) {
		  try { 
			hlsInstance.detachMedia();
			hlsInstance.destroy(); 
		  } catch(e) {}
		  hlsInstance = null;
		}
		
		const newHls = new Hls({ enableWorker: true, lowLatencyMode: true });
		hlsInstance = newHls;
		
		newHls.loadSource(url);
		newHls.attachMedia(videoElement);

		const updateAudioTracksUI = () => {
		  const audioTracks = newHls.audioTracks;
		  const container = document.getElementById('audioTrackContainer');
		  const select = document.getElementById('audioTrackSelect');

		  if (select && container) {
			if (audioTracks && audioTracks.length > 1) {
			  select.innerHTML = '';
			  audioTracks.forEach((track, index) => {
				const opt = document.createElement('option');
				opt.value = index;
				const langName = track.name || track.lang || `Pista ${index + 1}`;
				opt.textContent = `${index + 1}. ${langName.toUpperCase()}`;
				if (index === newHls.audioTrack) opt.selected = true;
				select.appendChild(opt);
			  });
			  container.classList.remove('hidden');
			  container.classList.add('flex');
			  lucide.createIcons();
			} else {
			  container.classList.add('hidden');
			  container.classList.remove('flex');
			}
		  }
		};

		newHls.on(Hls.Events.MANIFEST_PARSED, updateAudioTracksUI);
		newHls.on(Hls.Events.AUDIO_TRACKS_UPDATED, updateAudioTracksUI);
		
		const updateSubtitlesUI = () => {
		  const tracks = newHls.subtitleTracks;
		  const container = document.getElementById('subtitleTrackContainer');
		  const select = document.getElementById('subtitleTrackSelect');

		  if (select && container) {
			if (tracks && tracks.length > 0) {
			  select.innerHTML = '<option value="-1">🏴 Desactivados</option>';
			  tracks.forEach((track, index) => {
				const opt = document.createElement('option');
				opt.value = index;
				const langName = track.name || track.lang || `Subtítulo ${index + 1}`;
				opt.textContent = `${index + 1}. ${langName.toUpperCase()}`;
				if (index === newHls.subtitleTrack) opt.selected = true;
				select.appendChild(opt);
			  });
			  container.classList.remove('hidden');
			  container.classList.add('flex');
			  lucide.createIcons();
			} else {
			  container.classList.add('hidden');
			  container.classList.remove('flex');
			}
		  }
		};

		newHls.on(Hls.Events.MANIFEST_PARSED, updateSubtitlesUI);
		newHls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, updateSubtitlesUI);

		newHls.on(Hls.Events.ERROR, (event, data) => {
		  if (data.fatal) {
			if (data.type === Hls.ErrorTypes.NETWORK_ERROR || data.type === Hls.ErrorTypes.MEDIA_ERROR) {
			  if (connectionWatchdog) clearTimeout(connectionWatchdog);
			  handleStreamError(newHls);
			}
		  }
		});

	  } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
		videoElement.src = url;
	  }
	}

	videoElement.addEventListener('playing', () => {
	  if (connectionWatchdog) clearTimeout(connectionWatchdog);
	  if (bufferCheckTimer) clearTimeout(bufferCheckTimer);
	});

	videoElement.addEventListener('timeupdate', () => {
	  if (videoElement.currentTime > 0 && connectionWatchdog) {
		clearTimeout(connectionWatchdog);
	  }
	});

	function selectStream(id, recordHistory = true) {
      if (currentStream && currentStream.id !== id && recordHistory) {
        previousStreamId = currentStream.id;
        document.getElementById('preChannelBtn').disabled = false;
      }

      let target = streams.find(s => s.id === id) || allStreams.find(s => s.id === id);
      if (!target) return;

      currentStream = target;
      streams.forEach(s => s.active = (s.id === id));
      allStreams.forEach(s => s.active = (s.id === id));
      
	  localStorage.setItem('rpstv_last_channel', currentStream.id);
	  
      document.getElementById('activeCategory').textContent = currentStream.location || '';
      document.getElementById('activeTitle').textContent = currentStream.name || '';

      const activeLogo = document.getElementById('activeLogo');
      if (currentStream.logoUrl) {
        activeLogo.src = currentStream.logoUrl;
        activeLogo.classList.remove('hidden');
      } else {
        activeLogo.classList.add('hidden');
      }

      updateActiveFavButton();
      loadHlsStream(currentStream.hlsUrl);
      renderStreams();
    }

    function renderStreams() {
      const container = document.getElementById('streamList');
      container.innerHTML = '';

      let filtered = showingOnlyFavorites ? streams.filter(s => favorites.includes(s.id)) : streams;

      if (searchQuery.trim() !== "") {
        const query = searchQuery.toLowerCase();
        filtered = filtered.filter(s => 
          (s.location && s.location.toLowerCase().includes(query)) ||
          (s.name && s.name.toLowerCase().includes(query))
        );
      }

      const countLabel = showingOnlyFavorites ? `${filtered.length} favoritos` : `${filtered.length} canales`;
      document.getElementById('channelCount').textContent = countLabel;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">No se encontraron canales.</div>`;
        return;
      }

      filtered.forEach(stream => {
        const isFav = favorites.includes(stream.id);
        const card = document.createElement('div');
        
        card.className = `w-full p-3 rounded-xl border transition-all duration-200 flex items-center justify-between gap-2 ${
          stream.active ? 'bg-amber-500/10 border-amber-500/50 shadow-md' : 'bg-slate-900/40 border-slate-800 hover:bg-slate-900'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3 cursor-pointer flex-1 min-w-0" onclick="selectStream(${stream.id})">
            <div class="w-11 h-11 rounded-lg bg-slate-800 flex items-center justify-center overflow-hidden border border-slate-700 flex-shrink-0">
              ${stream.logoUrl 
                ? `<img src="${stream.logoUrl}" class="w-full h-full object-contain p-1" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=TV';"/>`
                : `<span class="font-bold text-slate-400 text-xs">${stream.id}</span>`
              }
            </div>
            <div class="truncate">
              <div class="font-bold text-base truncate ${stream.active ? 'text-amber-400' : 'text-slate-100'}">${stream.location}</div>
              <div class="text-xs text-slate-400 truncate">${stream.name}</div>
            </div>
          </div>
          
          <button onclick="toggleFavorite(${stream.id}); event.stopPropagation();" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-500 transition">
            <i data-lucide="star" class="w-4 h-4 ${isFav ? 'fill-amber-400 text-amber-400' : ''}"></i>
          </button>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function handleSearch() {
      const input = document.getElementById('searchInput');
      searchQuery = input.value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', searchQuery === "");
      renderStreams();
    }
	
	function changeAudioTrack(trackIndex) {
	  if (hlsInstance && hlsInstance.audioTracks[trackIndex]) {
		hlsInstance.audioTrack = parseInt(trackIndex);
	  }
	}
	
	function changeSubtitleTrack(trackIndex) {
	  if (hlsInstance) {
		hlsInstance.subtitleTrack = parseInt(trackIndex);
	  }
	}

    function clearSearch() {
      document.getElementById('searchInput').value = "";
      searchQuery = "";
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderStreams();
    }

    function openScheduleModal() {
      document.getElementById('scheduleModal').classList.remove('hidden');
    }

    function closeScheduleModal() {
      document.getElementById('scheduleModal').classList.add('hidden');
    }

	function populateScheduleSelect() {
	  const select = document.getElementById('scheduleChannelSelect');
	  if (!select) return;
	  select.innerHTML = '';

	  const countries = [...new Set(allStreams.map(item => item.name).filter(Boolean))].sort();

	  countries.forEach(country => {
		const optgroup = document.createElement('optgroup');
		optgroup.label = `📌 ${country}`;
		const countryChannels = allStreams.filter(s => s.name === country);
		countryChannels.forEach(s => {
		  const opt = document.createElement('option');
		  opt.value = s.id;
		  opt.textContent = `${s.location}`;
		  optgroup.appendChild(opt);
		});
		select.appendChild(optgroup);
	  });
	}

	function setChannelSchedule() {
	  const channelId = parseInt(document.getElementById('scheduleChannelSelect').value);
	  const timeValue = document.getElementById('scheduleTimeInput').value;

	  if (!timeValue) return alert("Selecciona una hora válida.");

	  const [hours, minutes] = timeValue.split(':').map(Number);
	  const now = new Date();
	  const targetTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);

	  if (targetTime <= now) return alert("Selecciona una hora futura.");

	  const msToWait = targetTime - now;
	  if (scheduledTimer) clearTimeout(scheduledTimer);

	  const targetStream = allStreams.find(s => s.id === channelId);

	  scheduledTimer = setTimeout(() => {
		if (targetStream) {
		  const countryFilter = document.getElementById('countryFilter');
		  if (countryFilter && countryFilter.value !== 'ALL') {
			countryFilter.value = 'ALL';
			filterStreams();
		  }
		  selectStream(targetStream.id);
		  showScheduleNotice(`Auto-Switch ejecutado: ${targetStream.location}`);
		  setTimeout(hideScheduleNotice, 8000);
		}
	  }, msToWait);

	  showScheduleNotice(`Programado: ${targetStream ? targetStream.location : 'Canal'} a las ${timeValue}`);
	  closeScheduleModal();
	}

    function showScheduleNotice(text) {
      const notice = document.getElementById('schedulerNotice');
      document.getElementById('schedulerNoticeText').textContent = text;
      notice.classList.remove('hidden');
      notice.classList.add('flex');
    }

    function hideScheduleNotice() {
      const notice = document.getElementById('schedulerNotice');
      notice.classList.add('hidden');
      notice.classList.remove('flex');
    }

    function castToTV() {
      if (videoElement.remote && videoElement.remote.state !== 'disconnected') {
        videoElement.remote.prompt();
      } else if (videoElement.webkitShowPlaybackTargetPicker) {
        videoElement.webkitShowPlaybackTargetPicker();
      } else {
        alert("Transmisión a Smart TV: Usa la opción 'Enviar/Cast' del menú de tu navegador o WebView.");
      }
    }

    function changeChannelRelative(offset) {
      const list = showingOnlyFavorites ? streams.filter(s => favorites.includes(s.id)) : streams;
      if (list.length === 0) return;
      const currentIndex = list.findIndex(s => s.id === currentStream?.id);
      let newIndex = (currentIndex + offset + list.length) % list.length;
      selectStream(list[newIndex].id);
    }

    function goToPreviousChannel() {
      if (previousStreamId) selectStream(previousStreamId);
    }

    function toggleFavorite(id) {
      if (!id) return;
      favorites = favorites.includes(id) ? favorites.filter(favId => favId !== id) : [...favorites, id];
      localStorage.setItem('rpstv_favorites', JSON.stringify(favorites));
      updateActiveFavButton();
      renderStreams();
    }

    function updateActiveFavButton() {
      const btn = document.getElementById('activeFavBtn');
      if (!currentStream) return;
      const isFav = favorites.includes(currentStream.id);
      btn.innerHTML = `<i data-lucide="star" class="w-5 h-5 ${isFav ? 'fill-amber-400 text-amber-400' : ''}"></i>`;
      lucide.createIcons();
    }

    function toggleFavoriteFilter() {
      showingOnlyFavorites = !showingOnlyFavorites;
      document.getElementById('favFilterText').textContent = showingOnlyFavorites ? 'Ver Todos' : 'Ver Favoritos';
      document.getElementById('listTitle').textContent = showingOnlyFavorites ? 'Canales Favoritos' : 'Lista de Canales';
      renderStreams();
    }

	function toggleClockVisibility() {
	  document.getElementById('digitalClockBadge').classList.toggle('hidden');
	}

	function toggleFullscreenWithClock() {
	  const container = document.getElementById('playerContainer');
	  if (!document.fullscreenElement) {
		if (container.requestFullscreen) container.requestFullscreen();
		else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
	  } else {
		if (document.exitFullscreen) document.exitFullscreen();
	  }
	}
	
	function populateCountryFilter(data) {
	  const select = document.getElementById('countryFilter');
	  if (!select) return;
	  select.innerHTML = '<option value="ALL">🌍 Todos los países (A-Z)</option>';
	  
	  const countries = [...new Set(data.map(item => item.name).filter(Boolean))].sort();
	  countries.forEach(country => {
		const opt = document.createElement('option');
		opt.value = country;
		opt.textContent = `🚩 ${country}`;
		select.appendChild(opt);
	  });
	}

	function filterStreams() {
	  const selectedCountry = document.getElementById('countryFilter')?.value || 'ALL';
	  const searchInput = (document.getElementById('searchInput')?.value || '').toLowerCase();
	  
	  localStorage.setItem('rpstv_last_country', selectedCountry);

	  streams = allStreams.filter(stream => {
		const matchesCountry = (selectedCountry === 'ALL') || (stream.name === selectedCountry);
		const matchesSearch = (stream.location || '').toLowerCase().includes(searchInput) ||
							  (stream.name || '').toLowerCase().includes(searchInput);
		return matchesCountry && matchesSearch;
	  });

	  renderStreams();
	}

	function handleStreamError(hlsInstance) {
	  if (typeof sendStreamAlert === 'function' && currentStream) {
		sendStreamAlert(currentStream.location, "Señal Caída", "Activación de estática por error HLS/Timeout.");
	  }

	  if (hlsInstance) {
		try {
		  hlsInstance.detachMedia();
		  hlsInstance.destroy();
		} catch(e) {}
	  }
	  
	  const video = document.getElementById('hlsPlayer');
	  video.pause();
	  video.removeAttribute('src');
	  video.load();

	  video.src = FALLBACK_VIDEO_URL;
	  video.loop = true;
	  video.load();
	  
	  const playPromise = video.play();
	  if (playPromise !== undefined) {
		playPromise.catch(() => {
		  video.muted = true;
		  video.play().catch(e => console.error("Error reproduciendo estática:", e));
		});
	  }
	}

	// --- ATAJOS DE TECLADO GLOBAL ---
	document.addEventListener('keydown', function (e) {
	  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
	  const key = e.key.toUpperCase();
	  switch (key) {
		case 'F': toggleFullscreenWithClock(); break;
		case 'R': toggleClockVisibility(); break;
		case 'W': goToPreviousChannel(); break;
		case 'S': changeChannelRelative(1); break;
		case 'P': changeChannelRelative(-1); break;
		case 'I': openScheduleModal(); break;
	  }
	});

	// --- AUTO-UNMUTE AL PRIMER TOQUE ---
	function enableAudioOnFirstInteraction() {
	  if (videoElement) videoElement.muted = false;
	  window.removeEventListener('click', enableAudioOnFirstInteraction);
	  window.removeEventListener('touchstart', enableAudioOnFirstInteraction);
	  window.removeEventListener('keydown', enableAudioOnFirstInteraction);
	}
	window.addEventListener('click', enableAudioOnFirstInteraction);
	window.addEventListener('touchstart', enableAudioOnFirstInteraction);
	window.addEventListener('keydown', enableAudioOnFirstInteraction);

	// --- MÓDULO DE GESTOS TÁCTILES EN EL VIDEO (SWIPE & DOBLE TAP) ---
	let touchStartX = 0;
	let touchStartY = 0;
	let touchStartTime = 0;
	let lastTapTime = 0;
	let osdTimeout = null;

	function showOsd(iconName, text) {
	  const osd = document.getElementById('gestureOsd');
	  const icon = document.getElementById('gestureOsdIcon');
	  const label = document.getElementById('gestureOsdText');

	  if (!osd || !icon || !label) return;

	  icon.setAttribute('data-lucide', iconName);
	  label.textContent = text;
	  if (typeof lucide !== 'undefined') lucide.createIcons();

	  osd.classList.remove('hidden');
	  if (osdTimeout) clearTimeout(osdTimeout);
	  osdTimeout = setTimeout(() => osd.classList.add('hidden'), 1200);
	}

	// Asignamos el oyente DIRECTAMENTE al elemento de video
	if (videoElement) {
	  videoElement.addEventListener('touchstart', function (e) {
		if (e.touches.length === 1) {
		  touchStartX = e.touches[0].clientX;
		  touchStartY = e.touches[0].clientY;
		  touchStartTime = new Date().getTime();
		}
	  }, { passive: true });

	  videoElement.addEventListener('touchend', function (e) {
		if (e.changedTouches.length !== 1) return;

		const touchEndX = e.changedTouches[0].clientX;
		const touchEndY = e.changedTouches[0].clientY;
		const diffX = touchEndX - touchStartX;
		const diffY = touchEndY - touchStartY;
		const duration = new Date().getTime() - touchStartTime;

		const rect = videoElement.getBoundingClientRect();
		const isLeftSide = (touchStartX - rect.left) < (rect.width / 2);

		// 1. Detección de Deslizamiento Vertical (Swipe arriba/abajo > 30px)
		if (Math.abs(diffY) > 30 && Math.abs(diffY) > Math.abs(diffX) && duration < 600) {
		  if (isLeftSide) {
			// Lado Izquierdo: Volumen
			let newVol = videoElement.volume + (diffY < 0 ? 0.1 : -0.1);
			newVol = Math.max(0, Math.min(1, newVol));
			videoElement.volume = newVol;
			const volPercent = Math.round(newVol * 100);
			showOsd(newVol === 0 ? 'volume-x' : 'volume-2', `Volumen: ${volPercent}%`);
		  } else {
			// Lado Derecho: Cambiar Canal
			if (diffY < 0) {
			  changeChannelRelative(1);
			  showOsd('chevron-right', 'Canal Siguiente');
			} else {
			  changeChannelRelative(-1);
			  showOsd('chevron-left', 'Canal Anterior');
			}
		  }
		}

		// 2. Doble Tap para Pantalla Completa
		const currentTime = new Date().getTime();
		const tapLength = currentTime - lastTapTime;
		if (tapLength < 300 && tapLength > 0 && Math.abs(diffX) < 15 && Math.abs(diffY) < 15) {
		  toggleFullscreenWithClock();
		}
		lastTapTime = currentTime;
	  });
	}

    document.addEventListener('DOMContentLoaded', fetchStreams);
  </script>
</body>
